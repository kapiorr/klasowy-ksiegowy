# Ukryj wersję nginx w nagłówkach i stronach błędów
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Nagłówki bezpieczeństwa
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ukryj nagłówki backendu
    proxy_hide_header X-Powered-By;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Oficjalne zakresy IP Cloudflare — tylko od nich ufamy CF-Connecting-IP
        # https://www.cloudflare.com/ips/
        set $real_ip $remote_addr;
        if ($http_cf_connecting_ip != '') {
            # Ustaw tylko jeśli request przyszedł przez Cloudflare Tunnel (cloudflared)
            # Tunnel łączy się lokalnie, więc remote_addr to 127.0.0.1 lub sieć Docker
            set $real_ip $http_cf_connecting_ip;
        }

        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $real_ip;
        proxy_set_header CF-Connecting-IP $real_ip;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
