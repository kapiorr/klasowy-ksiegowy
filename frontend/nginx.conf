# Ukryj wersję nginx w nagłówkach i stronach błędów
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Nagłówki bezpieczeństwa
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ukryj nagłówki backendu
    proxy_hide_header X-Powered-By;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;

        # Jeśli jest CF-Connecting-IP (przez Cloudflare Tunnel) użyj go,
        # w przeciwnym razie użyj bezpośredniego IP klienta
        set $real_ip $http_cf_connecting_ip;
        if ($real_ip = '') {
            set $real_ip $remote_addr;
        }

        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $real_ip;
        proxy_set_header CF-Connecting-IP $real_ip;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
