# Ukryj wersję nginx w nagłówkach i stronach błędów
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Nagłówki bezpieczeństwa
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ukryj nagłówki backendu
    proxy_hide_header X-Powered-By;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Przepisuj IP tylko gdy request pochodzi z sieci lokalnej (Docker/loopback)
        # czyli faktycznie przez Cloudflare Tunnel — cloudflared łączy się lokalnie
        # Zapobiega fałszowaniu CF-Connecting-IP przez zewnętrzne źródła
        set $real_ip $remote_addr;
        set $from_local 0;
        if ($remote_addr ~ ^127\.)                          { set $from_local 1; }
        if ($remote_addr ~ ^10\.)                           { set $from_local 1; }
        if ($remote_addr ~ ^172\.(1[6-9]|2[0-9]|3[01])\.) { set $from_local 1; }
        if ($remote_addr ~ ^192\.168\.)                     { set $from_local 1; }
        if ($remote_addr = "::1")                           { set $from_local 1; }
        set $cf_trusted "${from_local}${http_cf_connecting_ip}";
        if ($cf_trusted ~ ^1(.+)) {
            set $real_ip $http_cf_connecting_ip;
        }

        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $real_ip;
        proxy_set_header CF-Connecting-IP $real_ip;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
