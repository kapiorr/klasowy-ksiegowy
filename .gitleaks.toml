[extend]
useDefault = true

[[allowlists]]
description = "Ignore placeholder values in example env files"
paths = [
    '''\.env\.example$'''
]
stopWords = [
    "zmien_na",
    "your_",
    "change_me",
    "placeholder",
    "example",
]

